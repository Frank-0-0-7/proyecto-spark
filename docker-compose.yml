version: '3.8'

services:
  nodo-maestro:
    image: apache/spark:3.5.1
    container_name: nodo-maestro
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    ports:
      - "8080:8080"   # UI web del nodo Master
      - "7077:7077"   # Puerto de comunicación interna del clúster
      - "4040:4040"   # UI web de la aplicación (Jobs, Stages, SQL, DAGs)
    volumes:
      - ./data:/opt/spark/data
      - ./apps:/opt/spark/apps
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master

  nodo-esclavo-1:
    image: apache/spark:3.5.1
    container_name: nodo-esclavo-1
    depends_on:
      - nodo-maestro
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://nodo-maestro:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=1G
    volumes:
      - ./data:/opt/spark/data
      - ./apps:/opt/spark/apps
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://nodo-maestro:7077

  nodo-esclavo-2:
    image: apache/spark:3.5.1
    container_name: nodo-esclavo-2
    depends_on:
      - nodo-maestro
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://nodo-maestro:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=1G
    volumes:
      - ./data:/opt/spark/data
      - ./apps:/opt/spark/apps
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://nodo-maestro:7077